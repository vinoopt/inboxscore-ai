<!-- INBOX-179 Section 1: Vercel-style page header + action row.
     Scoped via .dom-* prefix to coexist with legacy chrome below. -->
<link rel="stylesheet" href="/static/css/domains-page-v2.css?v=5">
<!-- INBOX-179 §3 polish: hydrate dark theme BEFORE any rendering to
     avoid FOUC. Sets data-theme on documentElement (which exists
     immediately) — both [data-theme="dark"] CSS and the toggle script
     read from there. Tiny inline script, runs in head. -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('inboxscore-theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --surface-3: #e4e4e7;
  --border: #e4e4e7; --border-strong: #d4d4d8;
  --text: #18181b; --text-muted: #52525b; --text-subtle: #71717a;
  --accent: #7c3aed; --accent-hover: #6d28d9; --accent-soft: #ede9fe; --accent-glow: rgba(124,58,237,0.18);
  --green: #047857; --green-bg: #d1fae5;
  --yellow: #b45309; --yellow-bg: #fef3c7;
  --orange: #c2410c; --orange-bg: #ffedd5;
  --red: #b91c1c; --red-bg: #fee2e2;
}
body { font-family: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-feature-settings: "ss01","cv11"; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

/* Top Nav */
.topnav { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); z-index: 10; }
.logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); letter-spacing: -0.01em; }
.logo-icon { width: 26px; height: 26px; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; box-shadow: 0 4px 8px rgba(139,92,246,0.25); }
.nav-right { display: flex; align-items: center; gap: 16px; }
.user-name { font-size: 13px; color: var(--text-muted); }
.logout-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.logout-btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }
.mobile-toggle { display: none; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }

/* Layout */
.layout { display: flex; flex: 1; }

/* Sidebar */
.sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar-nav { list-style: none; }
.sidebar-nav li a { display: flex; align-items: center; gap: 10px; padding: 10px 24px; color: var(--text-muted); text-decoration: none; font-size: 14px; transition: all 0.2s; border-left: 3px solid transparent; }
.sidebar-nav li a:hover { color: var(--text); background: var(--surface-2); }
.sidebar-nav li a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.sidebar-nav li a .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 20px 24px 8px; font-weight: 600; }
.sidebar-bottom { margin-top: auto; padding: 16px 24px; border-top: 1px solid var(--border); }
.plan-badge { margin: auto 24px 0; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
.plan-badge .plan-name { font-weight: 600; color: var(--accent); text-transform: capitalize; }

/* Main */
.main { flex: 1; padding: 32px 40px; overflow-y: auto; max-height: calc(100vh - 53px); }

/* Page Header */
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
.page-title { font-size: 24px; font-weight: 700; }
.page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

/* Buttons */
.btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); background: transparent; color: var(--text-muted); }
.btn:hover { border-color: var(--text-muted); color: var(--text); }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-sm { padding: 6px 14px; font-size: 12px; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: border-color 0.2s; }

/* List filter bar — INBOX-138. See DESIGN-SYSTEM §11.8.
   Sits above the domain/IP list. Search input + sort/filter dropdowns
   on the left, result count on the right. Stays inline on desktop and
   wraps under-and-over on narrow screens. */
.list-filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.list-filters .filter-search { flex: 1 1 220px; min-width: 200px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.15s; }
.list-filters .filter-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.list-filters .filter-select { padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; cursor: pointer; outline: none; }
.list-filters .filter-select:hover { border-color: var(--text-muted); }
.list-filters .filter-count { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.list-filters .filter-clear { font-size: 12px; color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: none; padding: 0; }
.list-filters .filter-clear:hover { text-decoration: underline; }

/* Domain List */
.domain-list { display: flex; flex-direction: column; gap: 10px; }
.domain-card { padding: 16px 20px; margin-bottom: 0; display: flex; justify-content: space-between; align-items: center; }
.domain-info { display: flex; align-items: center; gap: 14px; }
.domain-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.domain-name { font-size: 14px; font-weight: 600; }
.domain-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.btn-remove { color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn-remove:hover { background: rgba(239,68,68,0.08); border-color: var(--red); color: var(--red); }

/* Usage Footer */
.usage-footer { margin-top: 16px; font-size: 12px; color: var(--text-muted); }
.usage-footer a { color: var(--accent); text-decoration: none; }
.usage-footer a:hover { text-decoration: underline; }

/* Empty State */
.empty-state { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 48px; text-align: center; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; margin-bottom: 6px; }
.empty-state p { color: var(--text-muted); font-size: 14px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 100; animation: slideIn 0.3s ease; }
.toast.success { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); }
.toast.error { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 420px; max-width: 90vw; }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.modal .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.modal .form-group { margin-bottom: 16px; }
.modal .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.modal .form-group input { width: 100%; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
.modal .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.sidebar-backdrop { display: none; position: fixed; inset: 0; top: 53px; background: rgba(0,0,0,0.5); z-index: 19; }
.sidebar-backdrop.show { display: block; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -260px; top: 53px; bottom: 0; z-index: 20; transition: left 0.3s; width: 260px; }
  .sidebar.open { left: 0; }
  .mobile-toggle { display: block; }
  .main { padding: 24px 16px; }
  .page-header { flex-direction: column; gap: 12px; }
  .page-header .btn-primary { align-self: flex-start; }
}

</style>
</head>

<script>

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// INBOX-179 §3: sidebar selector updated from `.sidebar` to `.dom-sidebar`
// (the legacy `.sidebar` markup is gone). Backdrop element kept verbatim.
function toggleSidebar() {
  const s = document.querySelector('.dom-sidebar');
  const b = document.getElementById('sidebar-backdrop');
  if (s) s.classList.toggle('open');
  if (b) b.classList.toggle('show');
}

// INBOX-179 §3 polish: dark-mode toggle. Sets data-theme on the
// documentElement (matches the early-hydrate script in <head> that
// runs before any rendering to prevent FOUC). Persists to localStorage.
function domToggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('inboxscore-theme', next); } catch (e) {}
}

let headers = {};

function getToken() {
  return localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
}

function logout() {
  localStorage.removeItem('access_token');
  localStorage.removeItem('refresh_token');
  localStorage.removeItem('user');
  sessionStorage.removeItem('access_token');
  sessionStorage.removeItem('refresh_token');
  sessionStorage.removeItem('user');
  window.location.href = '/login';
}

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ─── ADD DOMAIN MODAL ───────────────────────────────────

function openAddModal() {
  document.getElementById('domain-input').value = '';
  document.getElementById('add-modal').classList.add('show');
  setTimeout(() => document.getElementById('domain-input').focus(), 100);
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('show');
}

// Close modals on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeAddModal();
  }
});

// ─── DOMAIN LIST ────────────────────────────────────────

let allDomains = [];

async function loadDomains() {
  try {
    const res = await fetch('/api/user/domains', { headers });
    if (!res.ok) throw new Error();
    const data = await res.json();
    allDomains = data.domains || [];

    // INBOX-138: restore the saved sort preference (newest-first
    // default) before the first render so the user's choice survives
    // reloads. Same persistence pattern as INBOX-133 table sort.
    try {
      const savedSort = localStorage.getItem('domains.sort');
      if (savedSort) document.getElementById('domain-sort').value = savedSort;
    } catch (e) {}

    // Show the filter bar only when we have domains to filter — first-
    // run users (0 domains) see the empty state, no clutter.
    document.getElementById('domain-filters').style.display =
      allDomains.length > 0 ? 'flex' : 'none';

    applyDomainFilters();
    updateUsageFooter(allDomains.length);
  } catch (e) {
    document.getElementById('domains-container').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Could not load domains</h3><p>Something went wrong. Please try again.</p><button class="btn btn-primary" onclick="loadDomains()" style="margin-top:12px;">Retry</button></div>';
  }
}

// INBOX-138: read filter inputs, apply to allDomains, render the subset.
// Pure client-side — lists are tiny and instant feedback matters more
// than payload size. See DESIGN-SYSTEM §11.8.
function applyDomainFilters() {
  const q = (document.getElementById('domain-search').value || '').trim().toLowerCase();
  const sort = document.getElementById('domain-sort').value;

  // Persist sort choice for next visit.
  try { localStorage.setItem('domains.sort', sort); } catch (e) {}

  // Filter
  let filtered = allDomains;
  if (q) {
    filtered = allDomains.filter(d => (d.domain || '').toLowerCase().includes(q));
  }

  // Sort
  filtered = filtered.slice();
  if (sort === 'newest') {
    filtered.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  } else if (sort === 'oldest') {
    filtered.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  } else if (sort === 'az') {
    filtered.sort((a, b) => (a.domain || '').localeCompare(b.domain || ''));
  } else if (sort === 'za') {
    filtered.sort((a, b) => (b.domain || '').localeCompare(a.domain || ''));
  }

  // Update result count
  const countEl = document.getElementById('domain-filter-count');
  if (q) {
    countEl.innerHTML = 'Showing ' + filtered.length + ' of ' + allDomains.length +
      ' · <button class="filter-clear" onclick="clearDomainFilters()">Clear</button>';
  } else {
    countEl.textContent = allDomains.length === 1 ? '1 domain' : allDomains.length + ' domains';
  }

  // Render — show "no match" empty state when filter yields 0 results.
  if (filtered.length === 0 && q) {
    document.getElementById('domains-container').innerHTML =
      '<div class="empty-state">' +
      '<div class="empty-icon">🔍</div>' +
      '<h3>No domains match "' + escapeHtml(q) + '"</h3>' +
      '<p>Try a different search or clear the filter to see all ' + allDomains.length + ' domains.</p>' +
      '<button class="btn btn-primary" onclick="clearDomainFilters()" style="margin-top:16px;">Clear filter</button>' +
      '</div>';
  } else {
    renderDomains(filtered);
  }
}

function clearDomainFilters() {
  document.getElementById('domain-search').value = '';
  applyDomainFilters();
  document.getElementById('domain-search').focus();
}

// INBOX-179 §2: Map a domain's latest_score to the V2 status vocabulary.
// Score thresholds match Master Playbook colour rules (DESIGN-SYSTEM §11).
//   ≥ 70  → Healthy        (green pill, green score)
//   50–69 → Warnings       (amber pill, amber score)
//   < 50  → Critical       (red pill, red score)
//   null  → Scanning…      (zinc pill, em-dash score) — first scan pending
// "Scan failed" pill exists in the design vocabulary but the data model
// doesn't track scan failures yet; deferred to a future ticket.
function statusFromScore(score) {
  if (score == null) return { cls: 'pending', text: 'Scanning…', scoreCls: 'muted', scoreVal: '—' };
  if (score >= 70)   return { cls: '',        text: 'Healthy',   scoreCls: '',       scoreVal: String(score) };
  if (score >= 50)   return { cls: 'warn',    text: 'Warnings',  scoreCls: 'warn',   scoreVal: String(score) };
  return                     { cls: 'danger', text: 'Critical',  scoreCls: 'danger', scoreVal: String(score) };
}

// INBOX-179 §2: row click → domain detail. Remove button stops propagation
// so clicking it doesn't also navigate. Mockup says the whole row should
// be clickable — feels much less fiddly than "click only the name".
function goToDomain(domain) {
  if (!domain) return;
  window.location.href = '/domains/' + encodeURIComponent(domain);
}

function renderDomains(domains) {
  const container = document.getElementById('domains-container');
  if (!domains || domains.length === 0) {
    // V2 empty state — dashed border card with primary CTA.
    container.innerHTML = `
      <div class="dom-empty-state">
        <div class="dom-empty-state-title">No domains yet</div>
        <p class="dom-empty-state-sub">Add your first domain to start monitoring its email deliverability.</p>
        <button class="dom-add-btn" onclick="openAddModal()">+ Add Domain</button>
      </div>`;
    return;
  }

  // V2 connected-strip — one outer card, internal dividers between rows.
  // Globe SVG icon (replaces emoji 🌐). Status pill in fixed-width cell
  // for left-edge alignment. Tabular score on the right. Remove button
  // hover-only (set opacity: 0 by default).
  let html = '<div class="dom-domains-list">';
  domains.forEach(d => {
    const dateAdded = d.created_at ? 'Added ' + formatDate(d.created_at) : '';
    const s = statusFromScore(d.latest_score);
    const safeDomain = escapeHtml(d.domain);
    const safeId = escapeHtml(d.id);
    html += `
      <div class="dom-domain-row" onclick="goToDomain('${safeDomain}')">
        <div class="dom-domain-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        </div>
        <div class="dom-domain-info">
          <div class="dom-domain-name">${safeDomain}</div>
          <div class="dom-domain-meta">${escapeHtml(dateAdded)}</div>
        </div>
        <div class="dom-domain-status-cell">
          <span class="dom-domain-status ${s.cls}"><span class="dom-ind"></span>${s.text}</span>
        </div>
        <span class="dom-domain-score ${s.scoreCls}">${s.scoreVal}</span>
        <button class="dom-domain-action" onclick="event.stopPropagation(); removeDomain('${safeId}', '${safeDomain}')" aria-label="Remove ${safeDomain}">Remove</button>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

// INBOX-179 §2: usage-footer markup is being removed; the sidebar plan
// card (INBOX-180) takes over plan + usage display. This function still
// runs but only updates #plan-badge if it exists (legacy sidebar still
// has it until §3 / INBOX-180 ships). Null-safe on every element so we
// never throw if something's missing.
function updateUsageFooter(count) {
  const footer = document.getElementById('usage-footer');     // may be removed
  const text = document.getElementById('usage-text');         // may be removed
  const planBadge = document.getElementById('plan-badge');    // legacy sidebar

  let planName = 'Free';
  let maxDomains = 3;

  fetch('/api/auth/me', { headers }).then(r => r.ok ? r.json() : null).then(data => {
    if (data && data.user) {
      const plan = (data.user.plan || 'free').toLowerCase();
      if (plan === 'pro') { planName = 'Pro'; maxDomains = 10; }
      else if (plan === 'growth') { planName = 'Growth'; maxDomains = 25; }
      else if (plan === 'enterprise') { planName = 'Enterprise'; maxDomains = 100; }
      else { planName = 'Free'; maxDomains = 3; }

      if (text) text.textContent = count + ' of ' + maxDomains + ' domains used on your ' + planName + ' plan.';
      if (planBadge) planBadge.textContent = planName + ' Plan';
      if (footer) footer.style.display = 'block';
    }
  }).catch(() => {
    if (text) text.textContent = count + ' of ' + maxDomains + ' domains used on your ' + planName + ' plan.';
    if (footer) footer.style.display = 'block';
  });
}

async function addDomain() {
  const input = document.getElementById('domain-input');
  const btn = document.getElementById('add-btn');
  const domain = input.value.trim();
  if (!domain) {
    showToast('Please enter a domain name', 'error');
    return;
  }
  // Validate domain format
  const domainRegex = /^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/;
  if (!domainRegex.test(domain)) {
    showToast('Please enter a valid domain (e.g. example.com)', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Adding...';

  try {
    const res = await fetch('/api/user/domains', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ domain })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to add domain');

    input.value = '';
    closeAddModal();
    showToast('Domain added successfully');
    loadDomains();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Domain';
  }
}

async function removeDomain(domainId, domainName) {
  if (!confirm('Remove ' + domainName + ' from your domains?')) return;

  try {
    const res = await fetch('/api/user/domains/' + domainId, {
      method: 'DELETE',
      headers
    });
    if (!res.ok) throw new Error();
    showToast('Domain removed');
    loadDomains();
  } catch (e) {
    showToast('Failed to remove domain', 'error');
  }
}

// ─── INIT ───────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  const token = getToken();
  if (!token) { window.location.href = '/login'; return; }

  headers = { 'Authorization': 'Bearer ' + token };

  // Verify user
  fetch('/api/auth/me', { headers }).then(r => {
    if (!r.ok) throw new Error();
    return r.json();
  }).then(userData => {
    const name = userData.user.name || userData.user.email.split('@')[0];
    document.getElementById('user-name').textContent = name;
    const plan = userData.user.plan || 'free';
    document.getElementById('plan-name').textContent = plan;
  }).catch(() => {
    // Try refresh
    const refresh = localStorage.getItem('refresh_token') || sessionStorage.getItem('refresh_token');
    if (refresh) {
      fetch('/api/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refresh })
      }).then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(data => {
          // INBOX-157 (v1.16.4): unwrap nested session — see dashboard.html.
          const session = data.session || data;
          const accessToken  = session.access_token;
          const refreshToken = session.refresh_token;
          if (!accessToken || !refreshToken) throw new Error('refresh missing tokens');
          const storage = localStorage.getItem('refresh_token') ? localStorage : sessionStorage;
          storage.setItem('access_token', accessToken);
          storage.setItem('refresh_token', refreshToken);
          location.reload();
        }).catch(() => logout());
    } else { logout(); }
  });

  loadDomains();

  // Load alert badge count
  fetch('/api/user/alerts/count', { headers })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && data.unread_count > 0) {
        const badge = document.getElementById('sidebar-badge');
        badge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
        badge.style.display = 'inline';
      }
    }).catch(() => {});

  // INBOX-179 §3: sidebar selector updated to .dom-sidebar.
  // Close sidebar on mobile when clicking outside (in main).
  document.querySelector('.main').addEventListener('click', () => {
    const s = document.querySelector('.dom-sidebar');
    if (s) s.classList.remove('open');
  });
});
</script>
